<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pay MARKEX Trading Academy</title>
  <meta name="description" content="Pay MARKEX Trading Academy directly by UPI." />
  <style>
    :root {
      --green: #1bc98a;
      --ink: #f4f7f5;
      --muted: #a8b8b0;
      --bg: #07110d;
      --card: #101c16;
      --line: #234237;
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
      font-family: Georgia, "Times New Roman", serif;
      color: var(--ink);
      background:
        radial-gradient(900px 420px at 50% -10%, rgba(27, 201, 138, 0.18), transparent 60%),
        var(--bg);
    }
    main {
      width: min(440px, calc(100% - 28px));
      margin: 0 auto;
      padding: 20px 0 calc(28px + env(safe-area-inset-bottom));
    }
    .logo {
      display: block;
      width: 112px;
      height: auto;
      margin: 0 auto 14px;
      mix-blend-mode: lighten;
    }
    h1 {
      font-size: clamp(26px, 7vw, 34px);
      line-height: 1.1;
      font-weight: 500;
      margin: 0 0 8px;
    }
    .lede {
      margin: 0 0 22px;
      color: var(--muted);
      font-family: "Segoe UI", sans-serif;
      font-size: 15px;
      line-height: 1.5;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 18px;
    }
    .amounts {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    button, .pay-link {
      font-family: "Segoe UI", sans-serif;
    }
    .amounts button, .custom {
      width: 100%;
      border: 1px solid var(--line);
      background: transparent;
      color: var(--ink);
      border-radius: 12px;
      padding: 12px 10px;
      min-height: 48px;
      cursor: pointer;
      touch-action: manipulation;
    }
    .amounts button strong, .summary strong {
      display: block;
      font-size: 16px;
    }
    .amounts button span, .summary span {
      color: var(--muted);
      font-size: 12px;
    }
    .amounts button.active {
      border-color: var(--green);
      background: rgba(27, 201, 138, 0.12);
    }
    label {
      display: block;
      margin: 14px 0 6px;
      font-family: "Segoe UI", sans-serif;
      font-size: 12px;
      letter-spacing: 0.04em;
      color: var(--muted);
    }
    input {
      width: 100%;
      border: 1px solid var(--line);
      background: #0b1611;
      color: var(--ink);
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 16px;
    }
    .qr-wrap {
      margin-top: 16px;
      background: #fff;
      border-radius: 18px;
      padding: 14px;
      min-height: 280px;
      display: grid;
      place-items: center;
    }
    .qr-wrap svg { width: min(280px, 100%); height: auto; }
    .summary {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 14px;
      font-family: "Segoe UI", sans-serif;
    }
    .summary .amount { text-align: right; }
    .pay-link {
      display: block;
      text-align: center;
      text-decoration: none;
      margin-top: 14px;
      background: var(--green);
      color: #062117;
      font-weight: 700;
      border-radius: 14px;
      padding: 14px 16px;
      min-height: 48px;
      touch-action: manipulation;
    }
    @media (max-width: 480px) {
      .amounts { grid-template-columns: 1fr; }
      .summary { align-items: flex-start; }
      .summary .amount { text-align: right; }
      .qr-wrap { min-height: 0; padding: 10px; }
      .card { padding: 14px; }
    }
    .note {
      margin: 14px 4px 0;
      color: var(--muted);
      font-family: "Segoe UI", sans-serif;
      font-size: 12px;
      line-height: 1.45;
    }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="./assets/markex-logo.jpg" alt="MARKEX Forex Trading Academy" />
    <h1>Markex Trading Academy</h1>
    <p class="lede">Pay directly to the academy bank account. Scan the QR or open it in any UPI app.</p>
    <section class="card">
      <div class="amounts">
        <button type="button" data-amount="5000" class="active"><strong>₹5,000</strong><span>Enrollment</span></button>
        <button type="button" data-amount="10000"><strong>₹10,000</strong><span>Advanced membership</span></button>
      </div>
      <label for="amount">Amount in rupees</label>
      <input id="amount" inputmode="decimal" value="5000" />
      <div class="qr-wrap" id="qr" aria-label="UPI QR code"></div>
      <div class="summary">
        <div><span>Payee</span><strong>Markex Trading Academy</strong></div>
        <div class="amount"><span>Amount</span><strong id="amount-label">₹5,000.00</strong></div>
      </div>
      <a class="pay-link" id="pay-link" href="#">Open in UPI app</a>
    </section>
    <p class="note">Scan the QR or open your UPI app. The payment goes to Markex Trading Academy.</p>
  </main>
  <script type="module">
    import { qrcode } from "./packages/core/src/qr-lib.js";

    const payee = "Markex Trading Academy";
    const vpa = "akhilshijo5@oksbi";
    const amountInput = document.getElementById("amount");
    const qrHost = document.getElementById("qr");
    const payLink = document.getElementById("pay-link");
    const amountLabel = document.getElementById("amount-label");

    function money(value) {
      const amount = Math.round(Number(value) * 100) / 100;
      if (!Number.isFinite(amount) || amount <= 0 || amount > 100000) return null;
      return amount.toFixed(2);
    }

    function upiUri(amount) {
      const query = [
        ["pa", vpa],
        ["pn", payee],
        ["am", amount],
        ["cu", "INR"],
        ["tn", "MARKEX Trading Academy"]
      ].map(([key, val]) => key + "=" + encodeURIComponent(val)).join("&");
      return "upi://pay?" + query;
    }

    function render() {
      const amount = money(amountInput.value);
      document.querySelectorAll(".amounts button").forEach((button) => {
        button.classList.toggle("active", button.dataset.amount === String(Number(amount)));
      });
      if (!amount) {
        qrHost.textContent = "Enter an amount greater than zero.";
        payLink.removeAttribute("href");
        amountLabel.textContent = "—";
        return;
      }
      const uri = upiUri(amount);
      const qr = qrcode(0, "M");
      qr.addData(uri);
      qr.make();
      qrHost.innerHTML = qr.createSvgTag({ cellSize: 6, margin: 12, scalable: true });
      payLink.href = uri;
      amountLabel.textContent = "₹" + Number(amount).toLocaleString("en-IN", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    document.querySelectorAll(".amounts button").forEach((button) => {
      button.addEventListener("click", () => {
        amountInput.value = button.dataset.amount;
        render();
      });
    });
    amountInput.addEventListener("input", render);
    render();
  </script>
</body>
</html>
